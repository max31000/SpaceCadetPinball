<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pinball host test</title>
  <!--
    Dev-only host page: does exactly what the Bliss page does with a release build
    (createPinball + game files written into /data from preRun). Not part of the release asset.

    Query parameters:
      build  URL of the directory with SpaceCadetPinball.{js,wasm} (default ../../build-web/bin/)
      data   URL of the directory with the original XP files (default /pinball-data/)
      scale  CSS scale of the 600x416 canvas (default 1.5)
      ups    pin UPS instead of the measured display refresh rate
  -->
  <style>
    html, body { margin: 0; background: #3a6ea5; color: #000; font: 11px Tahoma, sans-serif; }
    main { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px; }
    canvas { display: block; outline: none; background: #000; }
    #log { width: 900px; max-width: 95vw; height: 120px; overflow: auto; background: #fff; padding: 4px;
           font: 11px monospace; white-space: pre-wrap; }
    dialog { font: 11px Tahoma, sans-serif; }
  </style>
</head>
<body>
<main>
  <div id="bar">
    <button id="new">Новая игра (F2)</button>
    <button id="pause">Пауза (F3)</button>
    <button id="sound">Звук</button>
    <input id="probe" placeholder="DOM input (typing test)" size="24">
    <span id="status">Загрузка…</span>
  </div>
  <canvas id="game"></canvas>
  <div id="log"></div>
</main>
<dialog id="hs">
  <form method="dialog">
    <p>Рекорд <b id="hs-score"></b>, место <b id="hs-rank"></b>. Имя:</p>
    <input id="hs-name" maxlength="31">
    <button value="ok">ОК</button> <button value="cancel">Отмена</button>
  </form>
</dialog>
<script type="module">
  const params = new URLSearchParams(location.search);
  const build = params.get('build') || '../../build-web/bin/';
  const dataUrl = params.get('data') || '/pinball-data/';
  const scale = parseFloat(params.get('scale') || '1.5');

  // The fixed file set of the Russian XP game (Bliss imports the same files via Vite ?url).
  const SOUNDS = ('1 104 105 108 111 112 12 13 131 136 14 16 17 18 181 19 20 21 22 24 240 243 25 26 27 28 ' +
    '29 3 30 34 35 36 38 39 4 42 43 45 49 49d 5 50 528 53 54 55 560 563 57 58 6 65 68 7 713 735 8 827 9 999')
    .split(' ').map((n) => `sound${n}.wav`);
  const FILES = ['pinball.dat', 'tahoma.ttf', ...SOUNDS];
  const OPTIONAL = ['PINBALL.OGG'];

  const logEl = document.getElementById('log');
  const statusEl = document.getElementById('status');
  const canvas = document.getElementById('game');
  window.blissEvents = [];
  const log = (s) => { logEl.textContent += s + '\n'; logEl.scrollTop = logEl.scrollHeight; };

  async function fetchFile(name, optional) {
    const r = await fetch(dataUrl + name);
    if (!r.ok) {
      if (optional) return null;
      throw new Error(`${name}: HTTP ${r.status}`);
    }
    return [name, new Uint8Array(await r.arrayBuffer())];
  }
  // Downloads run in parallel with the engine download; preRun holds main() until they finish.
  const filesPromise = Promise.all([
    ...FILES.map((n) => fetchFile(n, false)),
    ...OPTIONAL.map((n) => fetchFile(n, true)),
  ]).then((list) => list.filter(Boolean));

  const { default: createPinball } = await import(new URL('SpaceCadetPinball.js', new URL(build, location.href)).href);
  const t0 = performance.now();

  // Host decides the displayed size (CSS); the backing store is the 600x416 table of the
  // original 640x480 mode (also reported by the "started" event).
  const applyScale = (w, h) => {
    canvas.style.width = `${w * scale}px`;
    canvas.style.height = `${h * scale}px`;
    canvas.style.imageRendering = Number.isInteger(scale) ? 'pixelated' : 'auto';
  };
  applyScale(600, 416);

  const hsDialog = document.getElementById('hs');
  function onBlissEvent(type, json) {
    const data = JSON.parse(json);
    window.blissEvents.push({ type, data, t: performance.now() });
    log(`${type} ${json}`);
    if (type === 'started') {
      statusEl.textContent = `started in ${Math.round(performance.now() - t0)} ms`;
      applyScale(data.width, data.height);
      canvas.focus();
    } else if (type === 'highScoreEntry') {
      document.getElementById('hs-score').textContent = data.score;
      document.getElementById('hs-rank').textContent = data.rank;
      document.getElementById('hs-name').value = data.name;
      if (!window.blissAutomation) hsDialog.showModal();
    }
  }
  hsDialog.addEventListener('close', () => {
    const M = window.pinball;
    if (hsDialog.returnValue === 'ok')
      M.ccall('bliss_submit_high_score_name', 'number', ['string'], [document.getElementById('hs-name').value]);
    else
      M._bliss_cancel_high_score();
    canvas.focus();
  });

  const moduleArgs = {
    canvas,
    blissDataDir: '/data',
    locateFile: (name) => new URL(name, new URL(build, location.href)).href,
    print: (t) => console.log(t),
    printErr: (t) => console.warn(t),
    onBlissEvent,
    preRun: [(M) => {
      M.addRunDependency('bliss-data');
      filesPromise.then((files) => {
        for (const [name, bytes] of files) M.FS.writeFile(`/data/${name}`, bytes);
        M.removeRunDependency('bliss-data');
      }, (err) => { statusEl.textContent = 'Ошибка загрузки: ' + err.message; });
    }],
  };
  if (params.get('ups')) moduleArgs.blissUps = parseInt(params.get('ups'), 10);

  const M = await createPinball(moduleArgs);
  window.pinball = M;


  document.getElementById('new').onclick = () => { M._bliss_new_game(); canvas.focus(); };
  document.getElementById('pause').onclick = () => { M._bliss_toggle_pause(); canvas.focus(); };
  document.getElementById('sound').onclick = () => { M._bliss_toggle_sound(); canvas.focus(); };
  // F2/F3 etc. are handled by the game while the canvas has focus; keep the page from scrolling.
  canvas.addEventListener('keydown', (e) => {
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
  });
</script>
</body>
</html>
