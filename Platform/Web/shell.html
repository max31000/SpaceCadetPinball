<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>3D Pinball</title>
  <style>
    html, body { margin: 0; background: #000; color: #ccc; font: 12px Tahoma, sans-serif; }
    #game { display: flex; flex-direction: column; align-items: center; padding: 8px; }
    canvas { display: block; outline: none; image-rendering: pixelated; }
    #status { margin: 6px; }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    <div id="status">Загрузка…</div>
  </div>
  <script>
    // Minimal dev shell. Production host page: see Doc/web.md.
    var statusEl = document.getElementById('status');
    var Module = {
      canvas: document.getElementById('canvas'),
      print: function (t) { console.log(t); },
      printErr: function (t) { console.warn(t); },
      setStatus: function (t) { statusEl.textContent = t; },
      onRuntimeInitialized: function () { statusEl.textContent = ''; },
    };
    // Keep the page from scrolling on game keys while the game has focus.
    window.addEventListener('keydown', function (e) {
      if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'F1', 'F2', 'F3', 'F4', 'F10'].indexOf(e.key) >= 0)
        e.preventDefault();
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
